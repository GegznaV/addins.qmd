name: Documentation drift check

on:
  push:
    branches: [main, master, devel]
  pull_request:
    branches: [main, master, devel]
  workflow_dispatch:

jobs:
  docs-drift:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v3

      - uses: r-lib/actions/setup-r@v3
        with:
          r-version: "release"
          use-public-rspm: true
          extra-repositories: "https://mokymai.github.io/download/"

      - uses: r-lib/actions/setup-r-dependencies@v3
        with:
          extra-packages: |
            any::devtools
            any::rmarkdown
            any::pkgdown
          needs: website

      - name: Regenerate docs
        run: |
          Rscript -e "devtools::document(roclets = c('rd', 'collate', 'namespace'))"
          Rscript -e "rmarkdown::render('README.Rmd', output_format = 'github_document', quiet = TRUE)"
          Rscript -e "pkgdown::build_site(new_process = FALSE)"

      - name: Fail on stale generated artifacts
        run: |
          git diff --exit-code -- README.md NAMESPACE man docs
